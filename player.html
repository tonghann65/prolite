<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .play-button {
            position: relative;
            width: 68px;
            height: 68px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease;
            z-index: 2;
        }
        .player-container:hover .play-button {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .play-button::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 20px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 4px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer" onclick="playVideo()">
        <img class="thumbnail" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe" alt="Thumbnail">
        <div class="play-button"></div>
        <video id="videoElement" controls></video>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('video');

        function playVideo() {
            const video = document.getElementById('videoElement');
            const playBtn = document.querySelector('.play-button');
            const thumb = document.querySelector('.thumbnail');

            if (videoUrl) {
                thumb.style.display = 'none';
                playBtn.style.display = 'none';
                video.style.display = 'block';
                video.src = videoUrl;
                video.play().catch(e => {
                    window.location.href = videoUrl;
                });
            }
        }
    </script>
</body>
</html>
